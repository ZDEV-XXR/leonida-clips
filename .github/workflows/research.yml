name: outlier research
on:
  schedule:
    - cron: '23 14 * * 1'   # Mondays, 7:23 am Tucson
  workflow_dispatch:
    inputs:
      mode:
        description: 'discover or scan (blank = scan, or discover if no channel is approved yet)'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['research/channels.json', 'research/run']
permissions:
  contents: write
concurrency:
  group: research
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q -U yt-dlp
      - name: Top streamers
        env:
          TWITCH_CLIENT_ID: j7tp31gbxy1gt8qrit98dekl4v90j6
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python research/top_streamers.py
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && [ -f research/run ] && [ "${{ github.event_name }}" = "push" ] && MODE=$(head -1 research/run)
          [ "$MODE" = "top20" ] && { AUTO_APPROVE_TOP=1 python research/outliers.py discover; MODE=scan; }
          if [ -z "$MODE" ]; then
            MODE=$(python -c "import json;print('scan' if any(c.get('approved') for c in json.load(open('research/channels.json'))['channels']) else 'discover')")
          fi
          echo "mode: $MODE"
          python research/outliers.py $MODE
      - name: Commit
        run: |
          git config user.name "leonida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A research streamers.json
          git diff --cached --quiet && exit 0
          git commit -qm "Outlier research $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
