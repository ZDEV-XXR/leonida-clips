name: fetch clips
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  push:                     # the posting run pushes this when the queue is low (GitHub's cron skips a lot)
    branches: [main]
    paths: ['state/fetch-request']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated Twitch logins to fetch (blank = everyone)'
        required: false
        default: ''
      per_run:
        description: 'Clips to render this run'
        required: false
        default: '3'
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Fetch and render
        env:
          TWITCH_CLIENT_ID: gg6oqbuuds8qnjmbwhfahnumuon6v9   # public app id (leonidareplay-clipper); only the secret is private
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ONLY: ${{ github.event.inputs.only }}
          PER_RUN: ${{ github.event.inputs.per_run || '3' }}
        run: python clipper/fetch.py
      - name: Commit
        run: |
          git config user.name "leonida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue out state/seen.json state/trend.json streamers.json
          git diff --cached --quiet && exit 0
          git commit -qm "Fetch clips $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
