name: fetch clips
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Fetch and render
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python clipper/fetch.py
      - name: Commit
        run: |
          git config user.name "leonida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue out state streamers.json
          git diff --cached --quiet && exit 0
          git commit -qm "Fetch clips $(date -u +%FT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
