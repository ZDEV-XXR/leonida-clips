name: probe sources
on:
  push:
    branches: [main]
    paths: ['tools/probe_sources.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y -qq ffmpeg && pip install -q -U yt-dlp
      - run: python tools/probe_sources.py
      - name: Commit
        if: always()
        run: |
          git config user.name "leonida-bot"; git config user.email "actions@users.noreply.github.com"
          git add state/probe.json; git diff --cached --quiet && exit 0
          git commit -qm "Probe sources"; git pull -q --rebase origin main && git push -q origin main
