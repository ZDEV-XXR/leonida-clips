name: youtube shorts
on:
  push:
    branches: [main]
    paths: ['shorts/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shorts
jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Upload new Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python episode/upload_short.py
      - name: Commit
        if: always()
        run: |
          git config user.name "leonida-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A shorts
          git diff --cached --quiet && exit 0
          git commit -qm "YouTube Shorts uploaded"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin main && break; sleep 5; done
