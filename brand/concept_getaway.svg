<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120830"/>
      <stop offset="0.5" stop-color="#5b1a6e"/>
      <stop offset="1" stop-color="#ff5a8c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe46b"/>
      <stop offset="1" stop-color="#ff3d7f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24103f"/>
      <stop offset="1" stop-color="#0a0519"/>
    </linearGradient>
    <linearGradient id="carbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3ff5dc"/>
      <stop offset="1" stop-color="#0fa596"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa3cb"/>
      <stop offset="1" stop-color="#ff3f8e"/>
    </linearGradient>
    <linearGradient id="gator" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe05a"/>
      <stop offset="1" stop-color="#2f9a3a"/>
    </linearGradient>
    <radialGradient id="red" cx="0.08" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.2" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#2b6dff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#2b6dff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="above"><rect width="1080" height="640"/></clipPath>
  </defs>

  <!-- sky, sun, skyline -->
  <rect width="1080" height="1080" fill="url(#sky)"/>
  <g clip-path="url(#above)">
    <circle cx="560" cy="600" r="290" fill="url(#sun)"/>
    <g fill="#5b1a6e">
      <rect x="250" y="520" width="640" height="9"/>
      <rect x="250" y="552" width="640" height="13"/>
      <rect x="250" y="588" width="640" height="18"/>
      <rect x="250" y="626" width="640" height="22"/>
    </g>
  </g>
  <g fill="#1b0b38">
    <rect x="150" y="470" width="58" height="170"/><rect x="212" y="420" width="44" height="220"/>
    <rect x="260" y="500" width="64" height="140"/><rect x="790" y="455" width="52" height="185"/>
    <rect x="846" y="395" width="46" height="245"/><rect x="896" y="485" width="70" height="155"/>
  </g>
  <g fill="#ffd56b" opacity="0.85">
    <rect x="222" y="440" width="8" height="10"/><rect x="238" y="470" width="8" height="10"/><rect x="222" y="510" width="8" height="10"/>
    <rect x="858" y="420" width="8" height="10"/><rect x="874" y="460" width="8" height="10"/><rect x="858" y="520" width="8" height="10"/>
  </g>
  <!-- palms -->
  <g fill="#0d0524">
    <path d="M120 690 C128 590 140 520 160 440 L170 442 C152 525 142 595 138 690 Z"/>
    <path d="M165 440 C120 410 75 415 40 440 C82 426 125 430 160 448 Z"/>
    <path d="M165 440 C140 392 102 374 64 374 C106 388 138 412 158 446 Z"/>
    <path d="M165 440 C200 396 248 386 288 400 C244 402 205 420 170 448 Z"/>
    <path d="M165 440 C214 440 252 465 266 500 C238 476 204 460 166 450 Z"/>
    <path d="M955 690 C946 600 932 535 910 460 L900 462 C920 540 934 605 938 690 Z"/>
    <path d="M905 460 C948 432 995 434 1035 458 C990 446 946 452 908 468 Z"/>
    <path d="M905 460 C922 412 960 392 998 392 C960 408 930 432 911 466 Z"/>
    <path d="M905 460 C868 418 820 410 784 426 C826 426 864 442 900 468 Z"/>
  </g>

  <!-- road -->
  <rect x="0" y="640" width="1080" height="440" fill="url(#road)"/>
  <g fill="#ffd56b" opacity="0.75">
    <rect x="40" y="842" width="120" height="10" rx="5"/><rect x="250" y="842" width="120" height="10" rx="5"/>
    <rect x="460" y="842" width="120" height="10" rx="5"/><rect x="670" y="842" width="120" height="10" rx="5"/>
    <rect x="880" y="842" width="120" height="10" rx="5"/>
  </g>
  <!-- speed lines -->
  <g stroke="#ff8fbe" stroke-width="6" stroke-linecap="round" opacity="0.55">
    <path d="M60 700 L210 700"/><path d="M30 735 L170 735"/><path d="M80 770 L190 770"/>
  </g>

  <!-- police light glow from behind -->
  <rect width="1080" height="1080" fill="url(#red)"/>
  <rect width="1080" height="1080" fill="url(#blue)"/>

  <!-- police cruiser, chasing, half out of frame on the left -->
  <g transform="translate(-140 650)">
    <path d="M0 110 L20 60 C40 40 80 30 120 30 L190 30 L240 0 L330 0 L370 40 L400 50 C420 55 430 70 430 90 L430 115 L0 115 Z" fill="#f2f2f7"/>
    <path d="M0 80 L430 80 L430 115 L0 115 Z" fill="#14142a"/>
    <path d="M250 10 L325 10 L355 40 L235 40 Z" fill="#7fb4ff" opacity="0.7"/>
    <rect x="262" y="-18" width="26" height="16" rx="4" fill="#ff2b2b"/>
    <rect x="292" y="-18" width="26" height="16" rx="4" fill="#2b6dff"/>
    <circle cx="330" cy="118" r="34" fill="#0a0519"/><circle cx="330" cy="118" r="14" fill="#9aa0b8"/>
    <circle cx="80" cy="118" r="34" fill="#0a0519"/><circle cx="80" cy="118" r="14" fill="#9aa0b8"/>
    <rect x="410" y="62" width="22" height="12" rx="4" fill="#fff6c2"/>
  </g>

  <!-- getaway convertible -->
  <g transform="translate(300 600)">
    <!-- body -->
    <path d="M0 150 C0 118 20 100 60 96 L210 90 L290 60 L470 58 L560 92 L640 100 C670 104 690 122 690 150 L690 175 L0 175 Z" fill="url(#carbody)"/>
    <path d="M0 150 L690 150 L690 178 L0 178 Z" fill="#0b7d72"/>
    <path d="M30 130 L660 130" stroke="#ff5a9a" stroke-width="8"/>
    <!-- windshield -->
    <path d="M455 60 L500 20 L512 24 L478 62 Z" fill="#bff9ff" opacity="0.85"/>
    <!-- wheels -->
    <circle cx="140" cy="180" r="48" fill="#0a0519"/><circle cx="140" cy="180" r="22" fill="#ff5a9a"/><circle cx="140" cy="180" r="8" fill="#0a0519"/>
    <circle cx="560" cy="180" r="48" fill="#0a0519"/><circle cx="560" cy="180" r="22" fill="#ff5a9a"/><circle cx="560" cy="180" r="8" fill="#0a0519"/>
    <!-- head + tail lights -->
    <rect x="672" y="108" width="20" height="14" rx="4" fill="#fff6c2"/>
    <rect x="-2" y="108" width="16" height="14" rx="4" fill="#ff2b2b"/>
    <!-- headlight beam -->
    <path d="M692 112 L860 80 L860 150 Z" fill="#fff6c2" opacity="0.25"/>

    <!-- the driver: a gator in a hawaiian shirt and shades -->
    <g transform="translate(395 -10)">
      <path d="M-40 75 C-40 30 -10 10 30 12 C70 14 85 40 85 75 Z" fill="#ff7a3d"/>
      <g fill="#ffd56b"><circle cx="0" cy="40" r="7"/><circle cx="35" cy="55" r="6"/><circle cx="60" cy="32" r="6"/></g>
      <path d="M0 18 C-5 -35 30 -60 70 -55 L190 -40 C212 -36 215 -12 196 -6 L80 6 C50 14 10 30 0 18 Z" fill="url(#gator)"/>
      <path d="M80 6 L196 -6 C205 8 200 22 185 24 L90 30 C70 30 60 18 80 6 Z" fill="#2f9a3a"/>
      <g fill="#ffffff"><path d="M100 4 L108 18 L116 2 Z"/><path d="M130 0 L138 14 L146 -2 Z"/><path d="M160 -3 L168 11 L176 -5 Z"/></g>
      <circle cx="55" cy="-58" r="18" fill="#5ccc47"/>
      <path d="M20 -62 L110 -62" stroke="#14092b" stroke-width="7"/>
      <path d="M30 -62 C30 -40 66 -38 68 -60 Z" fill="#14092b"/>
      <path d="M72 -62 C72 -42 104 -42 106 -60 Z" fill="#14092b"/>
      <path d="M38 -56 L50 -56 M80 -56 L92 -56" stroke="#3ff5dc" stroke-width="4" stroke-linecap="round"/>
      <!-- steering wheel arm -->
      <path d="M40 60 C70 70 90 66 100 52" fill="none" stroke="url(#gator)" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- money bag + flying cash -->
    <g transform="translate(262 22)">
      <path d="M0 70 C-10 30 20 10 30 8 L22 -6 L58 -6 L50 8 C62 12 92 30 80 70 Z" fill="#c8a05a"/>
      <path d="M22 -6 L58 -6" stroke="#8a6a32" stroke-width="6"/>
      <text x="40" y="58" text-anchor="middle" font-family="Anton" font-size="40" fill="#5a3e12">$</text>
    </g>
    <g fill="#5ee67a" stroke="#1f7a35" stroke-width="3">
      <rect x="120" y="-40" width="54" height="28" rx="4" transform="rotate(-18 147 -26)"/>
      <rect x="60" y="-90" width="54" height="28" rx="4" transform="rotate(14 87 -76)"/>
      <rect x="-10" y="-30" width="54" height="28" rx="4" transform="rotate(-30 17 -16)"/>
    </g>
  </g>

  <!-- the mascot: flamingo standing in the back seat, filming the chase -->
  <g transform="translate(405 615) scale(0.78)">
    <path d="M-120 40 C-130 -40 -40 -80 50 -60 C140 -40 175 40 140 100 C110 150 -10 160 -80 120 C-120 100 -118 70 -120 40 Z" fill="url(#pink)"/>
    <path d="M-115 50 L-185 25 L-150 70 L-195 85 L-120 95 Z" fill="#ff3f8e"/>
    <path d="M95 -30 C150 -90 90 -150 70 -210 C55 -260 95 -310 140 -300" fill="none" stroke="url(#pink)" stroke-width="44" stroke-linecap="round"/>
    <circle cx="150" cy="-305" r="52" fill="#ff8fbe"/>
    <path d="M190 -300 C235 -305 262 -285 268 -250 C250 -268 228 -275 196 -270 Z" fill="#fff1e0"/>
    <path d="M240 -284 C258 -280 268 -265 268 -250 C258 -262 248 -268 236 -270 Z" fill="#1a0b36"/>
    <path d="M108 -328 L205 -328" stroke="#1a0b36" stroke-width="8"/>
    <path d="M118 -328 C118 -300 160 -295 162 -322 Z" fill="#1a0b36"/>
    <path d="M168 -328 C168 -300 206 -298 208 -324 Z" fill="#1a0b36"/>
    <path d="M126 -322 L140 -322 M176 -322 L188 -322" stroke="#3ff5dc" stroke-width="5" stroke-linecap="round"/>
    <!-- camcorder pointed back at the cops -->
    <g transform="translate(-75 -168) scale(-1 1) rotate(6)">
      <rect x="0" y="0" width="150" height="92" rx="16" fill="#1a0b36"/>
      <rect x="150" y="18" width="46" height="56" rx="8" fill="#2b1650"/>
      <circle cx="200" cy="46" r="26" fill="#3ff5dc"/><circle cx="200" cy="46" r="13" fill="#1a0b36"/>
      <rect x="40" y="-22" width="70" height="24" rx="6" fill="#2b1650"/>
      <circle cx="124" cy="22" r="11" fill="#ff2b2b"/>
    </g>
    <path d="M-40 10 C-80 -20 -120 -50 -150 -80" fill="none" stroke="#ff7fb3" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <rect x="270" y="930" width="540" height="92" rx="46" fill="#0a0519" stroke="#3ff5dc" stroke-width="6"/>
  <text x="540" y="997" text-anchor="middle" font-family="Anton" font-size="62" letter-spacing="3" fill="#ffffff">LEONIDA REPLAY</text>
</svg>
